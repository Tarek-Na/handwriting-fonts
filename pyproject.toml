[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hfont"
version = "0.1.0"
description = "Few-shot handwriting font generation: samples in, installable OpenType out"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "pillow>=10.0",
    "fonttools>=4.50",
    "scikit-image>=0.22",
    "scipy>=1.11",
    "uharfbuzz>=0.39",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyflakes>=3.0"]

[project.scripts]
hfont = "hfont.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:fontTools.*",
]
